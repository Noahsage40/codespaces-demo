<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stryker Sage Rep Trainer</title>
<style>
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0f0ec;--text:#1c1c1a;--muted:#5f5f5a;
  --border:#deded8;--accent:#a8590f;--accent-soft:#f6e8da;--good:#2f7d4a;--good-soft:#e2f2e7;
  --nurse:#e8eef6;--nurse-text:#1c2a3a;--radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614;--surface:#1f1f1c;--surface-2:#2a2a26;--text:#ecece6;--muted:#a3a39b;
    --border:#38382f;--accent:#e59a4f;--accent-soft:#3a2a1b;--good:#6cc58b;--good-soft:#1c3324;
    --nurse:#1f2a38;--nurse-text:#dce6f2;
  }
}
:root[data-theme="dark"]{
  --bg:#161614;--surface:#1f1f1c;--surface-2:#2a2a26;--text:#ecece6;--muted:#a3a39b;
  --border:#38382f;--accent:#e59a4f;--accent-soft:#3a2a1b;--good:#6cc58b;--good-soft:#1c3324;
  --nurse:#1f2a38;--nurse-text:#dce6f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font-size:1rem;margin:16px 0 6px}
p{margin:0 0 10px}
a{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:18px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
nav.tabs a{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:99px;text-decoration:none;font-size:.92rem}
nav.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.big{font-size:1.1rem}
.pill{display:inline-block;background:var(--accent-soft);color:var(--text);border-radius:99px;padding:2px 10px;font-size:.85rem;margin:2px 4px 2px 0}
.prod{border-top:1px solid var(--border);padding:12px 0}
.prod:first-of-type{border-top:0}
.prod b{font-size:1.02rem}
.prod .why{color:var(--muted);font-size:.93rem}
.script{background:var(--surface-2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;margin:8px 0}
ol,ul{padding-left:20px;margin:0 0 8px}
li{margin-bottom:4px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scen{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px 14px;border-radius:10px;cursor:pointer;font:inherit}
.scen small{display:block;color:var(--muted)}
.bubble{border-radius:12px;padding:10px 14px;margin:10px 0;max-width:92%}
.bubble.nurse{background:var(--nurse);color:var(--nurse-text)}
.bubble.me{background:var(--accent-soft);margin-left:auto}
.bubble .who{font-size:.78rem;font-weight:700;opacity:.75;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.fb{border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;background:var(--surface)}
.fb .score{font-size:1.3rem;font-weight:800;color:var(--accent)}
.fb h4{margin:10px 0 4px;font-size:.95rem}
.fb .better{background:var(--good-soft);border-radius:8px;padding:10px 12px;font-style:italic}
textarea{width:100%;min-height:96px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;background:var(--surface);color:var(--text);resize:vertical}
.muted{color:var(--muted);font-size:.9rem}
.tip{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stryker Sage Rep Trainer</h1>
  <p class="sub">Learn what Stryker Sage is and what it sells, then practice talking to nurses and get coached on every answer.</p>
  <nav class="tabs" id="tabs">
    <a href="#basics">1 · What is Sage?</a>
    <a href="#products">2 · Products</a>
    <a href="#intro">3 · Intro as a rep</a>
    <a href="#practice">4 · Practice with a nurse</a>
  </nav>
  <main id="view"></main>
</div>

<template id="t-basics">
  <section class="card">
    <h2>Stryker Sage in one sentence</h2>
    <p class="big">Stryker Sage makes simple, single-use products that help nurses <b>prevent harm that patients can pick up in the hospital</b>, like pneumonia, infections, bedsores and skin damage, and that help keep caregivers safe when moving patients.</p>
  </section>
  <section class="card">
    <h2>The basics</h2>
    <ul>
      <li><b>Who:</b> Sage Products started in Cary, Illinois. Stryker bought it in 2016 for $2.775 billion.</li>
      <li><b>Where it fits:</b> Sage is part of Stryker's <b>Medical</b> division (hospital beds, stretchers, patient care).</li>
      <li><b>What it sells:</b> disposable items that hospitals use every day, so customers reorder constantly.</li>
      <li><b>Who uses it:</b> nurses, nurse aides, OR and pre-op staff.</li>
      <li><b>Who decides:</b> nurse leaders, infection prevention, wound-care nurses, and the hospital's purchasing / value analysis committee.</li>
    </ul>
  </section>
  <section class="card">
    <h2>The problems Sage helps solve</h2>
    <p>Learn these first. Every conversation is really about one of these problems.</p>
    <ul>
      <li><b>Hospital pneumonia</b> (VAP / HAP): germs in the mouth get into the lungs. → <i>Oral care</i></li>
      <li><b>Surgical site infections</b> (SSI): germs on the skin infect a surgical wound. → <i>CHG prep cloths</i></li>
      <li><b>Pressure injuries</b> (bedsores): skin breaks down from lying in one position, especially on the heels. → <i>Heel protectors, turning systems</i></li>
      <li><b>Caregiver injuries</b>: nurses hurt their backs lifting and turning patients. → <i>AirTAP, air transfer mats</i></li>
      <li><b>Urinary infections from catheters</b> (CAUTI). → <i>External urine devices</i></li>
      <li><b>Skin damage from incontinence</b> (IAD). → <i>Barrier cream cloths</i></li>
      <li><b>Germs in bath basins</b>. → <i>Disposable bathing cloths</i></li>
    </ul>
    <p class="tip">Why hospitals care: these problems hurt patients, add days to a stay, and cost the hospital money.</p>
  </section>
</template>

<template id="t-products">
  <section class="card">
    <h2>The product families (simple version)</h2>
    <div class="prod"><b>Oral care: Q•Care, Toothette, Corinz rinse</b><br>Kits for cleaning patients' mouths, including patients on ventilators.<div class="why">Problem: hospital pneumonia (VAP / HAP)</div></div>
    <div class="prod"><b>2% CHG cloths</b><br>Antiseptic wipes patients use before surgery (night before and morning of). Rinse-free, active on skin for up to 6 hours.<div class="why">Problem: surgical site infections</div></div>
    <div class="prod"><b>Comfort Bath</b><br>Pre-moistened, rinse-free bathing washcloths that replace basins and soap.<div class="why">Problem: germs in bath basins, nurse time</div></div>
    <div class="prod"><b>Comfort Shield</b><br>Cleansing cloths with a barrier cream (3% dimethicone) for patients who are incontinent.<div class="why">Problem: skin damage from incontinence (IAD)</div></div>
    <div class="prod"><b>Prevalon heel protectors</b><br>Soft boots that float the heel off the bed.<div class="why">Problem: heel pressure injuries (the heel is the 2nd most common spot)</div></div>
    <div class="prod"><b>Prevalon TAP &amp; AirTAP</b><br>Turn-and-position systems. AirTAP uses air so staff can move patients with much less force.<div class="why">Problem: pressure injuries <i>and</i> caregiver back injuries</div></div>
    <div class="prod"><b>MATS (Mobile Air Transfer System)</b><br>An air mattress that floats patients for bed-to-stretcher or OR-table transfers.<div class="why">Problem: caregiver injuries during transfers</div></div>
    <div class="prod"><b>PrimoFit (men) &amp; PrimaFit (women)</b><br>External devices that use gentle suction to pull urine away, with no catheter inside the body.<div class="why">Problem: catheter infections (CAUTI) and wet skin</div></div>
  </section>
  <section class="card">
    <h2>Quick memory trick</h2>
    <p><span class="pill">Mouth → Oral care</span><span class="pill">Skin before surgery → CHG</span><span class="pill">Bathing → Comfort Bath</span><span class="pill">Incontinence → Comfort Shield / PrimoFit</span><span class="pill">Heels → Prevalon boots</span><span class="pill">Turning &amp; moving → TAP / AirTAP / MATS</span></p>
    <p class="tip">Want more depth? Product pages: <a href="https://www.stryker.com/us/en/sage/products/sage-oral-hygiene-tools.html" target="_blank" rel="noopener">oral care</a>, <a href="https://stryker.com/us/en/sage/products/sage-heel-protector-ii.html" target="_blank" rel="noopener">heel protector</a>, <a href="https://www.stryker.com/us/en/sage/products/sage-airtap-xxl.html" target="_blank" rel="noopener">AirTAP</a>, <a href="https://www.stryker.com/us/en/sage/products/sage-primafit.html" target="_blank" rel="noopener">PrimaFit</a>, <a href="https://www.stryker.com/us/en/sage/products/sage-barrier-cream-cloths.html" target="_blank" rel="noopener">Comfort Shield</a>.</p>
  </section>
</template>

<template id="t-intro">
  <section class="card">
    <h2>Introducing yourself to a nurse</h2>
    <p>Nurses are busy. Keep it short, respect their time, and make it about their patients, not your products.</p>
    <div class="script">"Hi, I'm [Name], I'm with Stryker Sage. We work with nursing teams on things like pressure injury prevention and safe patient handling. I know you're busy, so I won't take much time. Do you have two minutes, or is there a better time to catch you?"</div>
  </section>
  <section class="card">
    <h2>The 5-step conversation</h2>
    <ol>
      <li><b>Respect their time.</b> Ask permission to talk.</li>
      <li><b>Acknowledge what they already do.</b> "It's great you already have a protocol."</li>
      <li><b>Ask, don't pitch.</b> One open question: "What's the hardest part of…?"</li>
      <li><b>Connect to safety.</b> Tie their answer to patient safety <i>and</i> caregiver safety.</li>
      <li><b>Earn the next step.</b> Offer something small: a demo, a trial, an in-service.</li>
    </ol>
  </section>
  <section class="card">
    <h2>Good questions to have ready</h2>
    <ul>
      <li>"What does your current process look like for…?"</li>
      <li>"Where does that process tend to break down on a busy shift?"</li>
      <li>"How many staff does it usually take to reposition a larger patient?"</li>
      <li>"Has your unit had any staff injuries from lifting or turning?"</li>
      <li>"What would make this easier for your team?"</li>
    </ul>
  </section>
  <section class="card">
    <h2>Avoid</h2>
    <ul>
      <li>Leading with a product pitch before you know their problem.</li>
      <li>Arguing when they say "we already have something."</li>
      <li>Making clinical promises. Share what Stryker's materials say and offer to send the evidence.</li>
    </ul>
  </section>
</template>

<template id="t-practice">
  <section class="card" id="pick">
    <h2>Practice with a nurse</h2>
    <p>Pick a scenario. The nurse says something, you type how you'd respond, and your coach scores it out of 10, tells you what worked and how to make it stronger, then the nurse responds and you keep going.</p>
    <div id="scenList"></div>
  </section>
  <section class="card" id="chat" hidden>
    <div class="row" style="justify-content:space-between"><h2 id="chatTitle" style="margin:0"></h2><button class="btn" id="back">← Scenarios</button></div>
    <p class="muted" id="chatSetup"></p>
    <div id="log"></div>
    <form id="form">
      <textarea id="answer" placeholder="Type what you'd say to the nurse…"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="send" type="submit">Get feedback</button><button class="btn" type="button" id="hint">Show a tip</button><span class="muted" id="status"></span></div>
    </form>
  </section>
</template>

<script>
const SCENARIOS=[
 {id:"cold",title:"First hello on the unit",setup:"You walk onto a med-surg floor and approach the charge nurse at the station.",
  open:"Hi… can I help you? We're kind of in the middle of shift change.",tip:"Introduce yourself in one sentence, acknowledge they're busy, and ask for a better time or two minutes."},
 {id:"protocol",title:"\"We already have a protocol\"",setup:"You asked a med-surg nurse about pressure injury prevention.",
  open:"We already have a turning protocol and our staff is trained on it. I'm not sure we need anything new.",tip:"Don't argue. Praise the protocol, then ask where it gets hard to follow on a busy shift."},
 {id:"heavy",title:"Heavier patients are hard to move",setup:"Follow-up conversation with an ICU nurse.",
  open:"We sometimes struggle to reposition heavier patients because it takes multiple staff members, and it can be physically demanding.",tip:"Show empathy, ask one follow-up question (how many staff, any injuries?), and connect it to patient AND caregiver safety before mentioning a product."},
 {id:"what",title:"\"So what does Sage do?\"",setup:"A new nurse manager has never heard of Stryker Sage.",
  open:"Sorry, I've heard of Stryker beds, but what's Sage? What do you guys actually do?",tip:"Give a simple one-to-two sentence answer about preventing hospital-acquired conditions, then ask about their unit's priorities."},
 {id:"oral",title:"Oral care isn't getting done",setup:"Talking with an infection preventionist.",
  open:"Honestly, oral care for non-ventilated patients falls to the bottom of the list. Nurses just don't have time.",tip:"Agree it's hard, ask what gets in the way, and connect oral care to pneumonia risk on every unit."},
 {id:"price",title:"\"Your product costs more\"",setup:"A nurse manager is looking at a quote.",
  open:"These look nice, but they cost more than what we're using now. Our budget is tight.",tip:"Acknowledge the budget, then shift to the cost of the problem (a pressure injury or infection) versus the cost of prevention. Ask what their current rates look like."},
 {id:"brand",title:"\"We use another brand\"",setup:"Wound care nurse who's happy with a competitor.",
  open:"We already use another company's heel boots and they're fine.",tip:"Respect their choice, ask what they like about it and whether there's anything they'd change."},
 {id:"busy",title:"\"I don't have time for this\"",setup:"A busy bedside nurse mid-shift.",
  open:"Look, I've got six patients right now. I really don't have time for a sales pitch.",tip:"Respect it immediately. Ask for a better time or offer to come to a huddle or staff meeting instead."}
];

const COACH=`You are a friendly, encouraging sales coach training a new Stryker Sage medical sales rep. Stryker Sage (part of Stryker's Medical division, acquired 2016) makes single-use products that help nurses prevent hospital-acquired conditions and protect caregivers: oral care (Q•Care, Toothette, Corinz) for pneumonia/VAP/HAP; 2% CHG cloths for surgical site infection; Comfort Bath bathing cloths; Comfort Shield barrier cream cloths for incontinence-associated dermatitis; Prevalon heel protectors and TAP / AirTAP turn-and-position systems for pressure injuries and caregiver safety; MATS air transfer; PrimoFit/PrimaFit external urine management for CAUTI.
Good rep behaviour: respect the nurse's time, acknowledge what they already do, show empathy, ask ONE open discovery question before pitching, connect to patient safety AND caregiver safety and cost, avoid arguing and avoid unsupported clinical promises, earn a small next step.
You also play the nurse. Keep the nurse realistic, busy, a bit skeptical but fair. The nurse's next line should react naturally to what the rep actually said and open a new, slightly harder challenge.
Return ONLY JSON with these keys:
{"score": number 1-10 (halves allowed, be honest: 9+ is excellent),
 "summary": one short sentence verdict,
 "did_well": array of 2-3 short bullet strings,
 "improve": 1-3 short sentences on how to make it stronger,
 "stronger": an example stronger response in quotes-free plain text, 2-4 sentences, sounding natural,
 "nurse_next": the nurse's next line of dialogue,
 "next_task": one sentence telling the rep what to aim for in their next reply}`;

// ---------- routing ----------
const VIEWS=["basics","products","intro","practice"];
function cur(){const h=location.hash.slice(1);return VIEWS.includes(h)?h:"basics";}
function render(){
  const v=cur();
  document.querySelectorAll("#tabs a").forEach(a=>{ if(a.getAttribute("href")==="#"+v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const view=document.getElementById("view");
  view.innerHTML="";
  view.appendChild(document.getElementById("t-"+v).content.cloneNode(true));
  const next=VIEWS[VIEWS.indexOf(v)+1];
  if(next){const d=document.createElement("div");d.className="row";d.innerHTML=`<a class="btn primary" href="#${next}" style="text-decoration:none">Next: ${document.querySelector(`#tabs a[href="#${next}"]`).textContent.replace(/^\d · /,"")} →</a>`;view.appendChild(d);}
  if(v==="practice") initPractice();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

// ---------- practice ----------
let sample=null, sampleReady=false;
if(window.claude&&window.claude.use){ window.claude.use("sample").then(s=>{sample=s;sampleReady=true;}).catch(()=>{sampleReady=true;}); } else sampleReady=true;

let S=null, history=[], busy=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function initPractice(){
  document.getElementById("scenList").innerHTML=SCENARIOS.map(s=>`<button class="scen" data-id="${s.id}"><b>${esc(s.title)}</b><small>${esc(s.setup)}</small></button>`).join("");
  document.getElementById("scenList").onclick=e=>{const b=e.target.closest(".scen"); if(b) start(SCENARIOS.find(s=>s.id===b.dataset.id));};
  document.getElementById("back").onclick=()=>{document.getElementById("chat").hidden=true;document.getElementById("pick").hidden=false;};
  document.getElementById("hint").onclick=()=>addTip(S.tipNow||S.tip);
  document.getElementById("form").onsubmit=e=>{e.preventDefault();submit();};
}
function start(s){
  S={...s,tipNow:s.tip}; history=[{role:"nurse",text:s.open}];
  document.getElementById("pick").hidden=true; document.getElementById("chat").hidden=false;
  document.getElementById("chatTitle").textContent=s.title;
  document.getElementById("chatSetup").textContent=s.setup;
  document.getElementById("log").innerHTML="";
  addBubble("nurse",s.open);
  document.getElementById("answer").value="";
  document.getElementById("answer").focus();
}
function addBubble(who,text){
  const d=document.createElement("div");d.className="bubble "+(who==="nurse"?"nurse":"me");
  d.innerHTML=`<div class="who">${who==="nurse"?"Nurse":"You"}</div>${esc(text)}`;
  document.getElementById("log").appendChild(d); d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function addTip(t){const d=document.createElement("div");d.className="fb";d.innerHTML=`<h4 style="margin-top:0">Tip</h4>${esc(t)}`;document.getElementById("log").appendChild(d);d.scrollIntoView({behavior:"smooth",block:"nearest"});}
function addFeedback(f){
  const d=document.createElement("div");d.className="fb";
  d.innerHTML=`<div class="score">${esc(f.score)}/10</div><p>${esc(f.summary)}</p>
   <h4>What you did well</h4><ul>${(f.did_well||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <h4>How to make it stronger</h4><p>${esc(f.improve)}</p>
   <h4>A stronger response could be</h4><div class="better">"${esc(f.stronger)}"</div>
   ${f.next_task?`<h4>Next</h4><p>${esc(f.next_task)}</p>`:""}`;
  document.getElementById("log").appendChild(d);
}

async function submit(){
  const ta=document.getElementById("answer"), txt=ta.value.trim();
  if(!txt||busy) return;
  addBubble("me",txt); history.push({role:"rep",text:txt}); ta.value="";
  const status=document.getElementById("status"), btn=document.getElementById("send");
  if(!sample){
    addTip("Live coaching isn't available in this view. Compare your answer with this tip: "+S.tipNow);
    return;
  }
  busy=true; btn.disabled=true; status.textContent="Coach is reviewing…";
  const transcript=history.map(h=>(h.role==="nurse"?"NURSE: ":"REP: ")+h.text).join("\n");
  const prompt=`${COACH}\n\nScenario: ${S.title}. Setup: ${S.setup}\nCoaching focus for this scenario: ${S.tip}\n\nConversation so far:\n${transcript}\n\nScore and coach the REP's LAST reply, then give the nurse's next line.`;
  try{
    let f;
    try{ f=await sample.json(prompt,{cache:false}); }
    catch(e){ if(e&&e.code) throw e; const r=await sample(prompt,{cache:false}); f=JSON.parse((r.text.match(/\{[\s\S]*\}/)||["{}"])[0]); }
    addFeedback(f);
    if(f.nurse_next){ history.push({role:"nurse",text:f.nurse_next}); addBubble("nurse",f.nurse_next); }
    if(f.next_task) S.tipNow=f.next_task;
    status.textContent="";
  }catch(e){
    status.textContent = e&&e.code==="rate_limited" ? "Coach is busy, wait a moment and try again." : "Couldn't reach the coach. Try again.";
    if(e&&e.code==="not_granted"){ sample=null; addTip("Live coaching wasn't allowed. Tip for this scenario: "+S.tipNow); status.textContent=""; }
  }finally{ busy=false; btn.disabled=false; }
}

render();
</script>
</body>
</html>
